name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # One invocation so both build concurrently. default catches a stale
      # vendorHash; go-gate runs golangci-lint + nilaway + go test -race.
      - run: nix build .#default .#checks.x86_64-linux.go-gate
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: go-paths
        run: |
          echo "gocache=$(nix develop -c go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(nix develop -c go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-paths.outputs.gocache }}
            ${{ steps.go-paths.outputs.gomodcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - run: nix develop -c bats --recursive tests/ # adapter/hook/diagram integration tests
