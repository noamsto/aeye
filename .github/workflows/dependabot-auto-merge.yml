name: Dependabot auto-merge

# A dependency bump with green CI has nothing left for a human to decide.
#
# auto-merge (pull_request) is the policy: it queues every Dependabot PR for
# auto-merge except semver-major bumps, which stay for a human.
#
# merge-and-release (workflow_run) does the merge and the release dispatch. A
# GITHUB_TOKEN merge — including GitHub's own auto-merge, which merges as
# github-actions — emits no push or closed event, so release.yml would never
# refresh the release-please PR. workflow_run does fire, because the ci run was
# started by Dependabot (or the vendor-hash App), not GITHUB_TOKEN; and
# workflow_dispatch is the documented exception that lets this job start
# release.yml itself.
#
# The author check reads the PR, not the ci run's actor: after the vendor-hash
# App pushes a hash fix, the run's actor is that App, not Dependabot.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Safe despite the trigger: the default-branch copy of this file runs, nothing
  # is checked out, the job only calls the API, and it acts only on a same-repo
  # Dependabot PR whose ci run succeeded on the PR's exact head SHA.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Dependabot-triggered runs get a read-only token unless it is raised here.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # Nix flake inputs are commit pins, so update-type comes back empty for
        # them — excluding majors rather than allow-listing patch/minor keeps
        # those bumps eligible while still holding back Go/Action majors.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-and-release:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            | jq -r --arg branch "$HEAD_BRANCH" --arg base "$BASE" --arg repo "$GITHUB_REPOSITORY" \
              'map(select(.head.ref == $branch and .head.repo.full_name == $repo and .base.ref == $base and .user.login == "dependabot[bot]")) | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::No Dependabot PR from $HEAD_BRANCH into $BASE at $HEAD_SHA; nothing to do."
            exit 0
          fi

          read_pr() {
            IFS=$'\t' read -r state auto head < <(
              gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,autoMergeRequest,headRefOid \
                --jq '[.state, (.autoMergeRequest != null), .headRefOid] | @tsv'
            )
          }
          read_pr

          if [ "$state" = "CLOSED" ]; then
            echo "::notice::PR #$pr was closed without merging; nothing to do."
            exit 0
          fi

          if [ "$state" = "OPEN" ]; then
            if [ "$auto" != "true" ]; then
              echo "::notice::PR #$pr is not queued for auto-merge — semver-major or held back; leaving it for a human."
              exit 0
            fi
            if [ "$head" != "$HEAD_SHA" ]; then
              echo "::notice::PR #$pr head moved to $head; the ci run for that commit handles it."
              exit 0
            fi
            if ! gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"; then
              read_pr
              if [ "$state" != "MERGED" ]; then
                echo "::error::Merging PR #$pr failed and it is $state."
                exit 1
              fi
            fi
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE"
