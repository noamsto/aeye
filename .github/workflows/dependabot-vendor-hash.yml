name: dependabot-vendor-hash

# Dependabot updates go.mod/go.sum but cannot know the vendorHash the Nix
# expression pins, so every Go bump it opens fails the `nix` job until that
# hash is corrected. This pushes the correction onto the PR branch.
#
# pull_request_target is what grants the write token: Dependabot-triggered
# events get a read-only one and cannot read Actions secrets at all.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - go.mod
      - go.sum

permissions:
  contents: write

concurrency:
  group: vendor-hash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-hash:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: DeterminateSystems/determinate-nix-action@v3

      # No token exists in the job yet, so this build cannot exfiltrate one.
      # The App token is minted afterwards, purely to push.
      - name: Fix hashes
        run: determinate-nixd fix hashes --auto-apply

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.VENDOR_HASH_APP_ID }}
          private-key: ${{ secrets.VENDOR_HASH_APP_PRIVATE_KEY }}

      - name: Push the corrected hashes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.nix'; then
            echo "::notice::hashes already correct"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only .nix files: the fix step ran on PR content, so a wider add
          # would let a tampered workspace push arbitrary changes.
          git add -- '*.nix'
          git commit -m "build(deps): fix Nix hashes"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # An App token push re-triggers CI, so the stale `nix` failure clears
          # itself; a GITHUB_TOKEN push would leave the check pending forever.
          git push origin "HEAD:${HEAD_REF}"
