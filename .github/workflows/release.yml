name: release

on:
  push:
    branches: [main]
  # Dispatched by release-automerge.yml after it merges the release PR and by
  # dependabot-auto-merge.yml after a dependabot PR lands: a GITHUB_TOKEN
  # merge/push does not trigger workflows, but workflow_dispatch is the
  # documented exception, so this is what actually cuts the release.
  workflow_dispatch:
  # Backstop in case such a dispatch never happens. release-please is
  # idempotent, so an extra run only refreshes the release PR.
  schedule:
    - cron: "17 6 * * *"

permissions: {}

# Runs queue instead of overlapping: two concurrent release-please runs both
# failed (one on already_exists for the release, the other on a label the first
# had swapped), so goreleaser was skipped and v1.11.2 shipped no binaries. Never
# cancel a running release; GitHub keeps one pending run per group and replaces
# an older pending one, which is harmless because the surviving run reads the
# same or newer main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  # Gated on the same workflow run rather than the tag-push event: a tag created
  # by GITHUB_TOKEN does not trigger downstream workflows, so chaining via job
  # dependency is what builds the binaries without needing a PAT.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
